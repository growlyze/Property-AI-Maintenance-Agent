<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maintenance Requests Login</title>
<link href="https://fonts.bunny.net/css?family=switzer:400,500,600,700,800" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; word-break: break-word; overflow-wrap: break-word; }
:root { --cream: #f5f0e6; --dark: #140827; --orange: #f55809; }
body { font-family: 'Switzer', system-ui, -apple-system, sans-serif; background: var(--cream); color: var(--dark); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
.card { width: 100%; max-width: 420px; background: var(--cream); border: 2px solid var(--dark); border-radius: 10px; box-shadow: 6px 6px 0 var(--dark); padding: 2rem; }
.badge { display: inline-block; background: var(--orange); color: #fff; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .8rem; border-radius: 10px; margin-bottom: .9rem; }
h1 { font-size: 1.6rem; font-weight: 800; line-height: 1.2; margin-bottom: .4rem; }
p { font-size: .9rem; opacity: .7; font-weight: 500; margin-bottom: 1.5rem; line-height: 1.5; }
label { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: .4rem; }
input { width: 100%; font: inherit; font-size: 1rem; color: var(--dark); background: #fff; border: 2px solid var(--dark); border-radius: 10px; padding: .75rem .9rem; margin-bottom: 1.1rem; }
input:focus { outline: 3px solid var(--orange); outline-offset: 1px; }
button { width: 100%; font: inherit; font-weight: 800; font-size: 1rem; background: var(--dark); color: var(--cream); border: 2px solid var(--dark); border-radius: 10px; padding: .8rem 1rem; cursor: pointer; box-shadow: 4px 4px 0 var(--orange); }
button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--orange); }
.error { display: none; background: var(--orange); color: #fff; border: 2px solid var(--dark); border-radius: 10px; padding: .7rem .9rem; font-weight: 700; font-size: .88rem; margin-bottom: 1.1rem; }
.error.show { display: block; }
</style>
</head>
<body>
  <form class="card" method="POST" action="login">
    <span class="badge">AI Maintenance Agent</span>
    <h1>Maintenance Requests</h1>
    <p>Enter your staff or admin password to see tenant requests.</p>
    <div class="error __ERROR_CLASS__" role="alert">That password is not correct. Please try again.</div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
